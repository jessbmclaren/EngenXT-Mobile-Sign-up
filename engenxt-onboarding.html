<!DOCTYPE html>
<html lang="en-ZA" data-motion="system" data-text="default">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EngenXT · Welcome and link a vehicle</title>

<style>
/* ══════════════════════════════════════════════════════════════════════════
   ENGENXT · WELCOME AND LINK A VEHICLE

   What a driver sees straight after signing up: a reward they acknowledge,
   then the one thing they have to do. Two screens, deliberately separate. A
   celebration that also asks for something is neither.

   Atomic design levels as prefixes, BEM for structure, data-* attributes for
   runtime state. State is never a class.

     tokens     CSS custom properties    --color-primary
     atoms      a-                       a-btn, a-medal, a-confetti
     organisms  o-                       o-onboard
     templates  t-                       t-device-frame
     pages      p-                       p-onboard-demo
     utilities  u-                       u-visually-hidden
     developer  d-                       d-stateNav, d-panel
                                         Tooling. Never ships.

   THE TOKENS AND THE SHARED ATOMS BELOW ARE A COPY of the ones in
   engenxt-signup.html, taken verbatim so the two flows cannot disagree about
   a colour or a step of the spacing scale. That copy is the known debt in
   this pair of files: the moment a third flow appears, they belong in one
   stylesheet both files link, which works over file:// as long as it is a
   plain <link> and not a module.

   Nothing here is real. No points are awarded, nothing is remembered between
   loads, nothing is sent anywhere.
   ══════════════════════════════════════════════════════════════════════════ */

/* ══ TOKENS ══════════════════════════════════════════════════════════════ */
:root {
  /* Brand */
  --color-primary:       #1650B8;
  --color-primary-dark:  #0D3A8A;
  --color-primary-light: #EEF3FF;
  --color-primary-08: rgba(22,80,184,0.08);
  --color-primary-12: rgba(22,80,184,0.12);
  --color-primary-30: rgba(22,80,184,0.30);   /* gradient stop and button shadow */

  --color-secondary:     #E2231A;
  --color-secondary-bg:  #FDEEEE;
  --color-secondary-12: rgba(226,35,26,0.12);
  --color-secondary-25: rgba(226,35,26,0.25);
  --color-secondary-40: rgba(226,35,26,0.40);
  --color-secondary-04: rgba(226,35,26,0.04);
  --color-secondary-18: rgba(226,35,26,0.18);

  --color-tertiary-04: rgba(61,188,212,0.04);
  --color-tertiary-18: rgba(61,188,212,0.18);

  /* Semantic */
  --color-success:       #166832;    /* 5.09:1 on the sheet glass */
  --color-success-bg:    #E8F5EE;
  --color-success-20: rgba(22,104,50,0.20);
  --color-warning:       #9C4708;    /* 4.69:1 on the sheet glass */
  --color-warning-bg:    #FDF1E3;
  --color-warning-border: rgba(156,71,8,0.25);  /* --color-warning at 0.25, same hue */
  --color-whatsapp-dark: #0B6B5F;               /* 5.13:1 on the sheet glass */
  /* Error TEXT is darker than the brand red. --color-secondary is the Engen red in
     the logo, so it must not be darkened to satisfy a text contrast rule. */
  --color-error-text:    #B81510;    /* 4.94:1 on the sheet glass */

  /* Text */
  --color-text-primary:   #0d1e2a;
  --color-text-secondary: #4C5973;   /* 5.03:1 on the sheet glass */
  --color-text-tertiary:  #6C6C70;   /* disabled and placeholder, 4.79:1 on sunken */
  --color-text-muted:     #b0bcd0;   /* decorative only, never load-bearing text */
  --color-text-on-dark:   #ffffff;

  /* On-dark ramp, for anything sitting on the hero */
  --color-on-dark-strong: rgba(255,255,255,0.85);
  --color-on-dark-mid:    rgba(255,255,255,0.72);
  --color-on-dark-soft:   rgba(255,255,255,0.60);
  --color-on-dark-faint:  rgba(255,255,255,0.45);
  --color-on-dark-line:   rgba(255,255,255,0.18);
  --color-on-dark-fill:   rgba(255,255,255,0.10);

  /* Surface and border */
  --color-surface:        #ffffff;
  --color-surface-sunken: #F2F2F7;
  --color-surface-page:   #e4e6eb;
  --color-surface-hover:  #f5f5f5;
  --color-border:         rgba(0,0,0,0.08);
  --color-border-light:   rgba(0,0,0,0.06);
  --color-border-field:   rgba(0,0,0,0.45);   /* 3.2:1 against the field fill */
  --color-scrim:          rgba(0,0,0,0.45);
  --color-scrim-deep:     rgba(10,22,40,0.72);

  /* Hero */
  --color-hero-1: #0a1628;
  --color-hero-2: #0d2040;
  --color-hero-3: #0a1830;
  --gradient-hero: linear-gradient(175deg, var(--color-hero-1) 0%, var(--color-hero-2) 45%, var(--color-hero-3) 100%);
  --gradient-primary: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);

  /* Focus. Two tone so one ring works on the dark hero and the light sheet. */
  --color-focus:      var(--color-primary-dark);
  --color-handle:     rgba(0,0,0,0.25);
  --color-hardware:   #000;   /* the physical bezel, not a brand colour */
  --color-switch-track:   #8A91A3;   /* 3:1 against white */
  --color-focus-halo: rgba(255,255,255,0.92);

  /* Android system keyboard. Not app surface: this is the operating system's
     chrome, so it holds its own palette rather than borrowing EngenXT's. */
  --kb-surface:    #ECEFF3;
  --kb-key:        #FFFFFF;
  --kb-key-alt:    #DCE0E6;
  --kb-divider:    #D2D7DE;
  --kb-hint:       #C7CDD6;
  --kb-text:       #1B1E23;
  --kb-sub:        #6B7280;
  --kb-accent:     #1A73E8;
  --kb-on-accent:  #FFFFFF;

  /* Type */
  --font-sans: "SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  --font-mono: "SF Mono","Menlo",monospace;
  --text-hero:     42px;
  --text-title:    22px;
  --text-large:    20px;
  --text-heading:  18px;
  --text-subhead:  17px;
  --text-callout:  16px;
  --text-body:     15px;
  --text-footnote: 14px;
  --text-caption:  13px;
  --text-caption2: 12px;
  --text-micro:    11px;
  --text-nano:     10px;

  /* Radius */
  --radius-pill:   999px;
  --radius-phone:  47px;   /* the real corner at 390pt */
  --radius-notch:  22px;
  --radius-sheet:  28px;
  --radius-card:   16px;
  --radius-card-sm:12px;
  --radius-chip:   10px;
  --radius-circle: 50%;

  /* Elevation. One light source, from above. */
  --shadow-phone:     0 60px 200px rgba(0,0,0,0.85), 0 0 0 1px rgba(255,255,255,0.07);
  --shadow-sheet:     inset 0 var(--hairline) 0 rgba(255,255,255,0.65),
                      0 -12px 40px rgba(0,0,0,0.32), 0 -2px 8px rgba(0,0,0,0.16);
  --shadow-btn:       0 6px 16px var(--color-primary-30), 0 1px 3px rgba(13,58,138,0.20), inset 0 1px 0 rgba(255,255,255,0.16);
  --shadow-btn-white: 0 8px 32px rgba(0,0,0,0.40);
  --shadow-card:      0 1px 2px rgba(0,0,0,0.04), 0 4px 20px rgba(22,80,184,0.09);
  --shadow-field:     0 2px 14px var(--color-border-light);
  --shadow-knob:      0 1px 3px rgba(0,0,0,0.25);
  --shadow-overlay:   0 24px 64px rgba(0,0,0,0.30);
  --shadow-toast:     0 4px 20px rgba(0,0,0,0.30);
  --shadow-brand:     0 4px 16px var(--color-secondary-40);
  --shadow-inspect:   0 8px 32px rgba(0,0,0,0.28);

  /* Space. A 4px base with three half steps, because 6, 10 and 18 are
     structural here rather than exceptional, and a scale should be honest. */
  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
  --sp-5: 20px; --sp-6: 24px; --sp-7: 28px; --sp-8: 32px; --sp-12: 48px;

  /* Hardware. The status bar keeps its own height token because layout has to
     stop short of it, and the notch and time are drawn against the same value. */
  --size-status-bar: 78px;
  --sp-1h: 6px; --sp-2h: 10px;

  /* Size. Values that are neither spacing nor type. */
  --size-otp-cell: 52px;
  --size-control:  56px;   /* primary control height */
  --size-target:   48px;   /* minimum tap target */
  --hairline:      0.5px;

  /* Stacking. The only dimension where components genuinely couple, so it is
     the one that most needed a scale. Hardware sits above everything the app
     can draw. */
  --z-base:     0;
  --z-content:  2;
  --z-scrim:    9;
  --z-sheet:    10;
  --z-overlay:  30;
  --z-toast:    40;
  --z-hardware: 50;
  /* Tooling overlays sit between the app and the hardware, never above it. */
  --z-tool:     45;
  --z-tool-top: 60;

  /* Glass. Near opaque, because the sheet sits over a near-black hero and
     0.72 alpha put every piece of secondary text below 2.5:1. */
  --glass-sheet-bg: rgba(228,235,250,0.35);
  --glass-sheet-bd: blur(40px) saturate(180%) contrast(0.25) brightness(2.10);
  --glass-sheet-fallback: #E4EBFA;
  --glass-card-bg:  rgba(255,255,255,0.62);

  /* Motion */
  --ease-out:      cubic-bezier(0.16,1,0.3,1);
  --ease-in-out:   cubic-bezier(0.4,0,0.2,1);
  --ease-emphasis: cubic-bezier(0.32,0.72,0,1);
  --ease-spring:   cubic-bezier(.34,1.4,.64,1);
  --dur-fast:  0.12s;
  --dur-base:  0.30s;
  --dur-sheet: 0.38s;
  --dur-slow:  0.42s;
}

:root {
  /* Developer layer tokens. Separate from the product scale on purpose:
     the boundary runs one way: tooling reads product tokens because it
     documents them, but no product component may read a --d- token. */
  --d-level-atom:      #2563EB;
  --d-level-molecule:  #7C3AED;
  --d-level-organism:  #059669;
  --d-level-template:  #B45309;
  --d-surface-ink:     var(--color-text-primary);
  --d-accent-token:    #7DD3FC;
  --d-accent-missing:  #FCA5A5;
  --d-accent-inspect:  #38BDF8;
  --d-inspect-fill:    rgba(56,189,248,0.12);
  --d-inspect-edge:    rgba(0,0,0,0.35);
  --d-grid-line:       rgba(226,35,26,0.16);
  --d-grid-line-soft:  rgba(226,35,26,0.10);
  --d-copy-hover:      #E2EAFB;
  --d-rule:            #f4f5f7;
  --d-on-ink-soft:     rgba(255,255,255,0.45);
  --d-on-ink-line:     rgba(255,255,255,0.14);
  --d-panel-width:     420px;
}


*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  background: var(--color-surface-page);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
  color: var(--color-text-primary);
}
:focus-visible {
  outline: 3px solid var(--color-focus);
  outline-offset: 2px;
  box-shadow: 0 0 0 6px var(--color-focus-halo);
}
.u-visually-hidden {
  position: absolute; width: 1px; height: 1px;
  margin: -1px; padding: 0; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.a-btn {
  width: 100%; min-height: var(--size-control);
  display: flex; align-items: center; justify-content: center; gap: var(--sp-2);
  border-radius: var(--radius-pill);
  font-size: var(--text-subhead); font-weight: 700; letter-spacing: -0.3px;
  text-decoration: none; cursor: pointer;
  transition: transform var(--dur-fast) var(--ease-in-out),
              box-shadow var(--dur-fast) var(--ease-in-out),
              background var(--dur-base), color var(--dur-base), border-color var(--dur-base);
}
.a-btn:active { transform: scale(0.97); transition-duration: .1s; }
.a-btn--primary {
  background: var(--gradient-primary);
  color: var(--color-text-on-dark); box-shadow: var(--shadow-btn);
}
.a-btn--onDark {
  background: var(--color-surface); color: var(--color-text-primary);
  box-shadow: var(--shadow-btn-white);
}
.a-btn--outline {
  min-height: var(--size-target); background: transparent; color: var(--color-text-secondary);
  
  border: 1px solid var(--color-border-field);
  font-weight: 600;
}
.a-btn--outline:hover { background: var(--color-border-light); }
.a-btn--sm { min-height: var(--size-target); font-size: var(--text-footnote); }
.a-btn[aria-disabled="true"], .a-btn:disabled {
  background: var(--color-surface-sunken); color: var(--color-text-tertiary);
  border-color: transparent; box-shadow: none; cursor: default;
}
.a-btn[aria-disabled="true"]:active, .a-btn:disabled:active { transform: none; }
.a-link {
  min-height: var(--size-target); padding: var(--sp-2) var(--sp-1);
  font-variant-numeric: tabular-nums;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: var(--text-footnote); font-weight: 600; letter-spacing: -0.1px;
  color: var(--color-primary-dark); cursor: pointer; background: none; border: none;
}
.a-link--quiet { color: var(--color-text-secondary); font-weight: 600; }
.a-link--flush { padding-inline: 0; }
.a-link--onDark {
  color: var(--color-text-on-dark); text-decoration: underline;
  text-underline-offset: 3px; text-decoration-color: var(--color-on-dark-faint);
}
.a-link:disabled, .a-link[disabled] {
  color: var(--color-text-tertiary); font-weight: 500; cursor: default;
}
.a-icon-wrap {
  width: 40px; height: 40px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius-card-sm);
  background: var(--color-primary-light); border: 1px solid var(--color-primary-08);
}
.a-icon-wrap--lg { width: 64px; height: 64px; border-radius: var(--radius-circle); }
.a-icon-wrap[data-tone="error"]   { background: var(--color-secondary-bg); border-color: var(--color-secondary-12); }
.a-icon-wrap[data-tone="warning"] { background: var(--color-warning-bg);   border-color: var(--color-warning-border); }
.a-icon-wrap[data-tone="success"] { background: var(--color-success-bg);   border-color: var(--color-success-20); }
.a-handle { width: 36px; height: 5px; border-radius: var(--radius-pill); background: var(--color-handle); }
.a-spinner { animation: spin .7s linear infinite; flex-shrink: 0; }
.a-notch { width: 126px; height: 34px; background: var(--color-hardware); border-radius: 0 0 var(--radius-notch) var(--radius-notch); }
.m-status-bar {
  position: relative; z-index: var(--z-content); flex-shrink: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: calc(var(--size-status-bar) - 24px) var(--sp-6) 0;
  padding-top: max(calc(var(--size-status-bar) - 24px), env(safe-area-inset-top, 0px));
}
.m-status-bar__time { font-size: var(--text-body); font-weight: 600; letter-spacing: -0.3px; }
.m-status-bar__icons { display: flex; align-items: center; gap: var(--sp-1h); }
.m-status-bar[data-tone="onDark"] .m-status-bar__time { color: var(--color-on-dark-strong); }
.m-status-bar__net {
  font-size: var(--text-caption2); font-weight: 700; letter-spacing: -0.1px;
  color: var(--color-on-dark-soft); margin-left: var(--sp-2); display: none;
}
.m-notch {
  position: absolute; top: 0; left: 0; right: 0; height: 50px; z-index: var(--z-hardware);
  display: flex; justify-content: center; pointer-events: none;
}
.m-brand-lockup { display: flex; align-items: center; gap: var(--sp-2h); }
.m-brand-lockup__mark {
  width: 36px; height: 36px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--color-secondary); border-radius: var(--radius-chip);
  box-shadow: var(--shadow-brand);
}
.m-brand-lockup__name {
  font-size: var(--text-title); font-weight: 900; color: var(--color-text-on-dark);
  letter-spacing: -0.5px; line-height: 1; margin-bottom: 2px;
}
.m-brand-lockup__name em { font-style: normal; color: var(--color-secondary); }
.m-brand-lockup__tag {
  font-size: var(--text-micro); font-weight: 500; letter-spacing: 1.5px;
  text-transform: uppercase; color: var(--color-on-dark-faint);
}
[hidden] { display: none !important; }
.d-stateNav {
  width: 232px; flex-shrink: 0; align-self: flex-start;
  position: sticky; top: var(--sp-8);
  max-height: calc(100vh - var(--sp-8) * 2); overflow-y: auto;
  background: var(--color-surface); border-radius: var(--radius-card);
  
  padding: 0 var(--sp-3) var(--sp-4);
  box-shadow: var(--shadow-card);
}
.d-stateNav__switcher {
  position: sticky; top: 0; z-index: var(--z-content);
  display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-1);
  
  margin-inline: calc(var(--sp-3) * -1);
  padding: var(--sp-3) var(--sp-3) var(--sp-2);
  background: var(--color-surface);
  border-bottom: 1px solid var(--color-border-light);
}
.d-stateNav__tab {
  min-height: var(--size-target); cursor: pointer;
  padding: var(--sp-2) var(--sp-1); border-radius: var(--radius-chip);
  border: 1px solid transparent; background: none;
  font-size: var(--text-caption2); font-weight: 700; letter-spacing: -0.1px;
  color: var(--color-text-secondary);
  transition: background .15s, color .15s;
}
.d-stateNav__tab:hover { background: var(--color-surface-hover); }
.d-stateNav__tab[data-state="active"] {
  background: var(--color-primary-light); color: var(--color-primary-dark);
  border-color: var(--color-primary-12);
}
.d-stateNav__view > .d-stateNav__heading:first-child { margin-top: var(--sp-1); }
.d-stateNav__heading {
  font-size: var(--text-nano); font-weight: 700; letter-spacing: 0.8px;
  text-transform: uppercase; color: var(--color-text-secondary);
  
  padding: var(--sp-2) var(--sp-2h) var(--sp-1); margin-top: var(--sp-1);
}
.d-stateNav__heading:first-child { margin-top: 0; }
.d-stateNav__rule { height: 1px; background: var(--color-border-light); margin: var(--sp-2) 0; }
.d-stateNav__item {
  display: block; width: 100%; text-align: left; cursor: pointer;
  padding: var(--sp-1) var(--sp-2h); border-radius: var(--radius-chip);
  font-size: var(--text-caption2); font-weight: 600; color: var(--color-text-secondary);
  transition: background .15s, color .15s;
}
.d-stateNav__item:hover { background: var(--color-surface-hover); }
.d-stateNav__item[data-state="active"] {
  background: var(--color-secondary-12); color: var(--color-error-text); font-weight: 700;
}
.d-stateNav__toggle {
  display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2);
  width: 100%; cursor: pointer; padding: var(--sp-1) var(--sp-2h); border-radius: var(--radius-chip);
  font-size: var(--text-caption2); font-weight: 600; color: var(--color-text-secondary);
}
.d-stateNav__toggle:hover { background: var(--color-surface-hover); }
.d-stateNav__switch {
  width: 34px; height: var(--sp-5); border-radius: var(--radius-pill);
  background: var(--color-switch-track); flex-shrink: 0; position: relative; transition: background .18s;
}
.d-stateNav__switch::after {
  content: ""; position: absolute; top: 2px; left: 2px;
  width: var(--sp-4); height: var(--sp-4); border-radius: var(--radius-circle);
  background: var(--color-surface);
  box-shadow: var(--shadow-knob); transition: transform var(--dur-fast) var(--ease-in-out);
}
.d-stateNav__toggle[data-state="on"] .d-stateNav__switch { background: var(--color-primary); }
.d-stateNav__toggle[data-state="on"] .d-stateNav__switch::after { transform: translateX(14px); }
.d-key { padding: var(--sp-2) var(--sp-2h) var(--sp-1); }
.d-key__row {
  display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-2);
  padding: var(--sp-1) 0; font-size: var(--text-nano); color: var(--color-text-secondary);
}
.d-key__code { font-family: var(--font-mono); font-size: var(--text-nano); color: var(--color-text-primary); white-space: nowrap; }
.t-device-frame {
  position: relative; flex-shrink: 0;
  width: 390px; height: 844px;
  border-radius: var(--radius-phone); overflow: hidden;
  box-shadow: var(--shadow-phone);
  transition: width .25s var(--ease-out), height .25s var(--ease-out);
}
.t-device-frame[data-width="320"] { width: 320px; height: 720px; }
@keyframes pop       { from { opacity: 0; transform: scale(.5) } to { opacity: 1; transform: scale(1) } }
@keyframes spin      { to { transform: rotate(360deg) } }
.a-icon-wrap[data-motion="pop"] { animation: pop .5s var(--ease-spring) both; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important; animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
  }
}
[data-motion="reduced"] *, [data-motion="reduced"] *::before, [data-motion="reduced"] *::after {
  animation-duration: .001ms !important; animation-iteration-count: 1 !important;
  transition-duration: .001ms !important;
}
.d-panel {
  width: var(--d-panel-width); flex: 1 1 auto;
  min-height: 0; overflow-y: auto; overscroll-behavior: contain;
  background: var(--color-surface); border-radius: var(--radius-card);
  box-shadow: var(--shadow-card);
  display: none;
}
.d-panel__head {
  position: sticky; top: 0; z-index: var(--z-content);
  background: var(--color-surface); border-bottom: 1px solid var(--color-border-light);
  padding: var(--sp-4) var(--sp-4) var(--sp-3);
}
.d-panel__title { font-size: var(--text-callout); font-weight: 800; letter-spacing: -0.3px; }
.d-panel__lede { font-size: var(--text-micro); color: var(--color-text-secondary); line-height: 1.5; margin-top: 3px; }
.d-panel__tabs { display: flex; gap: var(--sp-1); margin-top: var(--sp-3); flex-wrap: wrap; }
.d-tab {
  padding: var(--sp-1) var(--sp-2h); border-radius: var(--radius-pill); cursor: pointer;
  font-size: var(--text-micro); font-weight: 700;
  background: var(--color-surface-sunken); color: var(--color-text-secondary);
}
.d-tab[data-state="active"] { background: var(--color-primary); color: var(--color-text-on-dark); }
.d-section { padding: var(--sp-4); border-bottom: 1px solid var(--color-border-light); }
.d-section[hidden] { display: none; }
.d-section__title {
  font-size: var(--text-nano); font-weight: 800; letter-spacing: 0.9px;
  text-transform: uppercase; color: var(--color-text-muted); margin-bottom: var(--sp-3);
}
.d-section__note {
  font-size: var(--text-micro); line-height: 1.55; color: var(--color-text-secondary);
  margin-bottom: var(--sp-3);
}
.d-row {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-1h) 0; border-bottom: 1px solid var(--d-rule);
}
.d-row:last-child { border-bottom: none; }
.d-row__swatch {
  width: 34px; height: 34px; flex-shrink: 0; border-radius: var(--radius-chip);
  border: 1px solid var(--color-border); background-clip: padding-box;
}
.d-row__name {
  flex: 1; min-width: 0;
  font-family: var(--font-mono); font-size: var(--text-micro);
  color: var(--color-text-primary); word-break: break-all;
}
.d-row__value {
  font-family: var(--font-mono); font-size: var(--text-nano);
  color: var(--color-text-secondary); text-align: right; flex-shrink: 0; max-width: 46%;
  word-break: break-all;
}
.d-row__bar { height: 12px; border-radius: 3px; background: var(--color-primary); flex-shrink: 0; }
.d-row__radius {
  width: 44px; height: 34px; flex-shrink: 0;
  border: 2px solid var(--color-primary); border-right: none; border-bottom: none;
  background: var(--color-primary-light);
}
.d-copyBtn {
  padding: 5px 10px; border-radius: var(--radius-chip); cursor: pointer;
  font-size: var(--text-nano); font-weight: 700;
  background: var(--color-primary-light); color: var(--color-primary-dark);
}
.d-copyBtn:hover { background: var(--d-copy-hover); }
.d-check {
  display: flex; gap: var(--sp-2); align-items: flex-start;
  padding: var(--sp-2) 0; border-bottom: 1px solid var(--color-border-light);
}
.d-check__mark {
  flex-shrink: 0; width: 18px; text-align: center;
  font-size: var(--text-caption); font-weight: 800; line-height: 1.5;
}
.d-check[data-result="pass"] .d-check__mark { color: var(--color-success); }
.d-check[data-result="fail"] .d-check__mark { color: var(--color-error-text); }
.d-check[data-result="warn"] .d-check__mark { color: var(--color-warning); }
.d-check[data-result="skip"] .d-check__mark { color: var(--color-text-tertiary); }
.d-check__body { font-size: var(--text-micro); line-height: 1.5; color: var(--color-text-secondary); }
.d-check__body b { color: var(--color-text-primary); }
.d-check__detail { display: block; color: var(--color-text-tertiary); font-family: var(--font-mono); font-size: var(--text-nano); }
.d-check__tally {
  font-size: var(--text-caption); font-weight: 700; color: var(--color-text-primary);
  padding: var(--sp-2) 0 var(--sp-3);
}
.d-check__tally b { color: var(--color-error-text); }
.d-gridOverlay {
  position: absolute; inset: 0; z-index: var(--z-tool); pointer-events: none; display: none;
  background-image:
    repeating-linear-gradient(to bottom, var(--d-grid-line) 0 1px, transparent 1px 4px),
    repeating-linear-gradient(to right,  var(--d-grid-line-soft) 0 1px, transparent 1px 4px);
}

/* ══ ONBOARDING ══════════════════════════════════════════════════════════
   Two screens shown once, after sign-up: a reward the driver acknowledges,
   then the task they have to do. They are deliberately separate. A
   celebration that also asks for something is neither. */

/* a-medal. The reward graphic: a ring, a number and its unit. An atom
   because it cannot be broken down without ceasing to mean anything. */
.a-medal {
  position: relative; flex-shrink: 0;
  width: 132px; height: 132px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  border-radius: var(--radius-circle);
  background: var(--color-on-dark-fill);
  border: 1.5px solid var(--color-on-dark-faint);
}
/* The ring reads as an achievement without a second colour. */
.a-medal::before {
  content: ""; position: absolute; inset: -10px;
  border-radius: var(--radius-circle);
  border: 1.5px dashed var(--color-on-dark-faint);
}
.a-medal__value {
  font-size: var(--text-hero); font-weight: 800; line-height: 1;
  letter-spacing: -2px; color: var(--color-text-on-dark);
  font-variant-numeric: tabular-nums;
}
.a-medal__unit {
  margin-top: var(--sp-1);
  font-size: var(--text-micro); font-weight: 700; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--color-on-dark-soft);
}
/* With motion turned down the burst does not run, so the graphic carries the
   moment on its own with a still glow. */
[data-motion="reduced"] .a-medal,
.a-medal[data-motion="still"] { box-shadow: 0 0 0 6px var(--color-primary-12), 0 0 48px var(--color-primary-30); }

/* a-confetti. Decorative, one burst, and never in the way: it sits above the
   graphic and below nothing that can be tapped. */
.a-confetti {
  position: absolute; inset: 0; z-index: var(--z-content);
  pointer-events: none;
}
[data-motion="reduced"] .a-confetti { display: none; }

/* o-onboard. A full screen of its own, because the sign-up sheet has finished
   its job and a sheet over a hero would say the flow is still in progress. */
.o-onboard {
  position: absolute; inset: 0; z-index: var(--z-overlay);
  display: none; flex-direction: column;
  padding: calc(var(--size-status-bar) + var(--sp-6)) var(--sp-5)
           calc(var(--sp-6) + env(safe-area-inset-bottom, 0px));
  overflow-y: auto; overscroll-behavior: contain;
}
.o-onboard[data-state="visible"] { display: flex; }
/* The device's own chrome stays on top of an app screen, the way it does on a
   phone. Without this the surface covered the clock and the battery. */
.m-notch, .m-status-bar { z-index: var(--z-tool-top); }
.o-onboard--reward { background: var(--gradient-hero); text-align: center; align-items: center; }
.o-onboard--task   { background: var(--color-surface-page); }

.o-onboard__eyebrow {
  font-size: var(--text-micro); font-weight: 700; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--color-on-dark-soft);
  margin-bottom: var(--sp-6);
}
/* The burst needs a positioned parent to sit inside. */
.o-onboard__stage { position: relative; display: flex; justify-content: center; }
/* The title takes focus so the new screen is announced. It is not a tab stop,
   so no keyboard user lands on it, and a ring round a heading only makes it
   look like something to press. */
.o-onboard__title:focus, .o-onboard__title:focus-visible { outline: none; box-shadow: none; }
.o-onboard__title {
  margin-top: var(--sp-6);
  font-size: var(--text-title); font-weight: 800; letter-spacing: -0.5px;
}
.o-onboard--reward .o-onboard__title { color: var(--color-text-on-dark); }
.o-onboard--task   .o-onboard__title { color: var(--color-text-primary); text-align: left; }
.o-onboard__body {
  margin-top: var(--sp-2);
  font-size: var(--text-caption); line-height: 1.6;
}
.o-onboard--reward .o-onboard__body { color: var(--color-on-dark-soft); max-width: 30ch; }
.o-onboard--task   .o-onboard__body { color: var(--color-text-secondary); }
/* The gap before the action is flexible, so the button sits at the bottom on a
   tall screen and is simply the next thing along on a short one. */
.o-onboard__spacer { flex: 1 1 var(--sp-8); min-height: var(--sp-8); }
.o-onboard__actions { width: 100%; display: flex; flex-direction: column; gap: var(--sp-2); }
/* Directly above the action it qualifies, because a caution about camera
   access belongs to the button that asks for the camera, not to the picture
   halfway up the screen. */
.o-onboard__note {
  margin-bottom: var(--sp-3);
  font-size: var(--text-caption2); line-height: 1.5; color: var(--color-text-secondary);
}
.o-onboard__back {
  align-self: flex-start; margin-bottom: var(--sp-4);
  min-height: var(--size-target); padding-inline: 0;
}

/* The task screen's illustration: a licence disc, which is a South African
   windscreen disc and not a driving licence. Kept small on purpose so it can
   never push the action below the fold. */
.o-onboard__art {
  align-self: center; margin: var(--sp-6) 0;
  width: 128px; height: 128px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius-circle);
  background: var(--color-primary-light);
  border: 1px solid var(--color-primary-08);
}

/* A prototype that hands over to another one should be walkable in both
   directions, or the second flow is only reachable by finding the file. */
.d-stateNav__item--link {
  display: block; text-decoration: none;
  color: var(--color-primary-dark); font-weight: 700;
}

/* ── d-stateNav, two levels ───────────────────────────────────────────
   The list of states outgrew a single column: thirty seven of them under
   five headings meant scrolling past the whole prototype to reach the end.
   The sidebar now names the sections and a panel beside it holds the states
   in the one you opened, which is the shape a long menu wants. */
.d-stateNav__flow {
  font-size: var(--text-nano); font-weight: 700; letter-spacing: 0.8px;
  text-transform: uppercase; color: var(--color-text-tertiary);
  padding: var(--sp-2) var(--sp-2h) var(--sp-1); margin-top: var(--sp-2);
}
.d-stateNav__flow:first-of-type { margin-top: 0; }
.d-stateNav__group {
  display: flex; align-items: center; gap: var(--sp-2);
  width: 100%; cursor: pointer; text-align: left;
  min-height: var(--size-target);
  padding: var(--sp-2) var(--sp-2) var(--sp-2) var(--sp-2h);
  border-radius: var(--radius-chip);
  border: none; background: none;
  font-size: var(--text-caption); font-weight: 700; color: var(--color-text-primary);
  transition: background .15s;
}
/* The label takes the room, so the count and the chevron are pushed together
   at the end. Three children on space-between put the count adrift in the
   middle of the row, related to nothing on either side of it. */
.d-stateNav__group > span:first-child { flex: 1 1 auto; }
.d-stateNav__meta {
  flex: 0 0 auto; display: flex; align-items: center; gap: var(--sp-1h);
  color: var(--color-text-tertiary);
}
.d-stateNav__group:hover { background: var(--color-surface-hover); }
/* The open section stays marked while its panel is up, so the sidebar always
   says which one you are looking at. */
.d-stateNav__group[aria-expanded="true"] {
  background: var(--color-primary-light); color: var(--color-primary-dark);
}
.d-stateNav__group[aria-expanded="true"] .d-stateNav__meta { color: var(--color-primary-dark); }
/* Metadata, not content: it says how many without competing with the name. */
.d-stateNav__count {
  font-size: var(--text-nano); font-weight: 700;
  font-variant-numeric: tabular-nums; min-width: 14px; text-align: right;
}
.d-stateNav__chev { flex-shrink: 0; opacity: .55; }

/* d-flyout. The states of the open section. Sticky and scrolling on its own,
   so a long list never drags the page with it. */
.d-flyout {
  position: fixed; z-index: var(--z-tool-top);
  width: 260px; max-height: min(70vh, 560px);
  display: flex; flex-direction: column;
  background: var(--color-surface); border-radius: var(--radius-card);
  box-shadow: var(--shadow-overlay);
  overflow: hidden;
}
.d-flyout__head {
  display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2);
  padding: var(--sp-3) var(--sp-2) var(--sp-2) var(--sp-4);
  border-bottom: 1px solid var(--color-border-light);
}
.d-flyout__title { font-size: var(--text-caption); font-weight: 800; color: var(--color-text-primary); }
.d-flyout__close {
  flex-shrink: 0; width: var(--size-target); height: var(--size-target);
  display: flex; align-items: center; justify-content: center;
  border: none; background: none; cursor: pointer; border-radius: var(--radius-circle);
  /* The glyph is pushed to the trailing edge so the 48px target does not
     shove the title inwards. */
  margin-right: calc(var(--sp-2) * -1);
}
.d-flyout__close:hover { background: var(--color-surface-hover); }
.d-flyout__list {
  flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
  padding: var(--sp-2) var(--sp-3) var(--sp-3);
  scrollbar-width: thin;
}
/* Selecting a state does not close the panel: stepping through a section is
   the job, and closing after each one would cost two clicks a state. */
.d-flyout .d-stateNav__item { width: 100%; }
.d-flyout__hint {
  padding: var(--sp-2) var(--sp-4) var(--sp-3);
  font-size: var(--text-nano); color: var(--color-text-tertiary);
  border-top: 1px solid var(--color-border-light);
}

@media (max-width: 900px) {
  /* No room beside the sidebar, so the panel becomes a sheet on the screen. */
  .d-flyout {
    left: var(--sp-4); right: var(--sp-4); width: auto;
    bottom: var(--sp-4); top: auto; max-height: 60vh;
  }
}

/* ══ PAGE ════════════════════════════════════════════════════════════════ */
/* Left aligned, not centred. The sidebar is the thing you reach for most, so
   it sits where the pointer already is rather than drifting with the width of
   the window. */
.p-onboard-demo {
  min-height: 100vh;
  display: flex; align-items: flex-start; justify-content: flex-start;
  gap: var(--sp-6); padding: var(--sp-8) var(--sp-6);
}
/* The nav holds the left edge and the phone centres in whatever is left, so
   the thing you reach for stays put and the thing you are looking at sits in
   the middle of the space it has. */
.p-onboard-demo__stage {
  flex: 1 1 auto; min-width: 0;
  display: flex; flex-direction: column; align-items: center; gap: var(--sp-3);
}
.p-onboard-demo__caption {
  font-size: var(--text-micro); color: var(--color-text-secondary); text-align: center;
  max-width: 390px; line-height: 1.5;
}
@media (max-width: 900px) {
  .p-onboard-demo { flex-direction: column; align-items: center; padding: var(--sp-4); }
  .d-stateNav { position: static; width: 100%; max-width: 390px; max-height: none; }
}
@media (max-width: 440px) {
  .p-onboard-demo { padding: 0; gap: 0; }
  .t-device-frame { width: 100%; height: 100dvh; border-radius: 0; box-shadow: none; }
  .d-stateNav { max-width: none; border-radius: 0; }
}
</style>
</head>
<body>
<div class="p-onboard-demo">

  <!-- ══ STATE NAV, tooling ═══════════════════════════════════════════ -->
  <nav class="d-stateNav" id="stateNav" aria-label="Prototype states">
    <div class="d-stateNav__switcher" role="tablist" aria-label="Sidebar view">
      <button class="d-stateNav__tab" id="tabStates" type="button" role="tab"
              aria-selected="true" aria-controls="viewStates" data-state="active">States</button>
      <button class="d-stateNav__tab" id="tabNotes" type="button" role="tab"
              aria-selected="false" aria-controls="viewNotes">Design notes</button>
    </div>

    <div class="d-stateNav__view" id="viewStates" role="tabpanel" aria-labelledby="tabStates">
      <div id="navSections"></div>
    </div>

    <div class="d-stateNav__view" id="viewNotes" role="tabpanel" aria-labelledby="tabNotes" hidden>
      <p class="d-stateNav__heading">Modes</p>
      <div id="navModes"></div>
      <div class="d-stateNav__rule"></div>
      <p class="d-stateNav__heading">Where this sits</p>
      <div class="d-key" id="navKey"></div>
    </div>
  </nav>

  <!-- ══ DEVICE ═══════════════════════════════════════════════════════ -->
  <div class="p-onboard-demo__stage">
    <div class="t-device-frame" id="deviceFrame">

      <div class="m-notch" aria-hidden="true"><div class="a-notch"></div></div>
      <div class="m-status-bar" data-tone="onDark" aria-hidden="true" id="statusBar">
        <span class="m-status-bar__time">9:41</span>
        <span class="m-status-bar__icons">
          <svg class="m-status-bar__signal" width="17" height="12" viewBox="0 0 17 12" fill="none">
            <rect x="0" y="7" width="3" height="5" rx="1" fill="var(--color-on-dark-strong)"/>
            <rect x="4.5" y="4.5" width="3" height="7.5" rx="1" fill="var(--color-on-dark-strong)"/>
            <rect x="9" y="2" width="3" height="10" rx="1" fill="var(--color-on-dark-strong)"/>
            <rect x="13.5" y="0" width="3" height="12" rx="1" fill="var(--color-on-dark-strong)"/>
          </svg>
          <svg width="25" height="12" viewBox="0 0 25 12" fill="none">
            <rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="var(--color-on-dark-faint)"/>
            <rect x="1.5" y="1.5" width="18" height="9" rx="2.5" fill="var(--color-on-dark-strong)"/>
            <path d="M22.5 4.2L22.5 7.8C23.4 7.4 23.4 4.6 22.5 4.2Z" fill="var(--color-on-dark-faint)"/>
          </svg>
        </span>
      </div>

      <!-- SCREEN ONE · the reward, acknowledged before anything is asked -->
      <section class="o-onboard o-onboard--reward" id="rewardScreen"
               aria-labelledby="rewardTitle" hidden>
        <p class="o-onboard__eyebrow">Welcome reward</p>
        <div class="o-onboard__stage">
          <div class="a-medal" id="rewardMedal" role="img" aria-label="10 starter points earned">
            <span class="a-medal__value">10</span>
            <span class="a-medal__unit">pts</span>
          </div>
          <canvas class="a-confetti" id="rewardConfetti" aria-hidden="true"></canvas>
        </div>
        <h1 class="o-onboard__title" id="rewardTitle" tabindex="-1">Welcome to EngenXT</h1>
        <p class="o-onboard__body">
          You earned 10 starter points. Your points count towards airtime and data rewards.
        </p>
        <div class="o-onboard__spacer"></div>
        <div class="o-onboard__actions">
          <button class="a-btn a-btn--onDark" id="rewardCta" type="button">Continue</button>
        </div>
      </section>

      <!-- SCREEN TWO · the task, on its own -->
      <section class="o-onboard o-onboard--task" id="vehicleScreen"
               aria-labelledby="vehicleTitle" hidden>
        <button class="a-link a-link--flush o-onboard__back" id="vehicleBack" type="button">Back</button>
        <h1 class="o-onboard__title" id="vehicleTitle" tabindex="-1">Link the vehicle you drive</h1>
        <p class="o-onboard__body" id="vehicleBody"></p>
        <span class="o-onboard__art" id="vehicleArt" aria-hidden="true"></span>
        <div class="o-onboard__spacer"></div>
        <p class="o-onboard__note" id="vehicleNote"></p>
        <div class="o-onboard__actions" id="vehicleActions"></div>
      </section>

      <span class="u-visually-hidden" id="announcer" role="status" aria-live="polite"></span>
      <div class="d-gridOverlay" aria-hidden="true"></div>
    </div>

    <p class="p-onboard-demo__caption" id="caption">Pick a state on the left.</p>
  </div>

  <div class="p-onboard-demo__rail" id="demoRail">
    <aside class="d-panel" id="specPanel" aria-label="Design specification"></aside>
  </div>
</div>

<script>
(function () {
  'use strict';

  var root  = document.documentElement;
  var frame = document.getElementById('deviceFrame');
  var $ = function (id) { return document.getElementById(id); };
  var el = {
    root: root, frame: frame,
    reward: $('rewardScreen'), rewardTitle: $('rewardTitle'), rewardMedal: $('rewardMedal'),
    rewardConfetti: $('rewardConfetti'), rewardCta: $('rewardCta'),
    vehicle: $('vehicleScreen'), vehicleTitle: $('vehicleTitle'), vehicleBody: $('vehicleBody'),
    vehicleNote: $('vehicleNote'), vehicleArt: $('vehicleArt'), vehicleBack: $('vehicleBack'),
    vehicleActions: $('vehicleActions'),
    announcer: $('announcer'), caption: $('caption'), statusBar: $('statusBar')
  };

  /* ════════════════════════════════════════════════════════════════════
     MOCK STATE
     Front of house only. Nothing here awards a point, remembers anything
     between loads, or reaches a server.
     ════════════════════════════════════════════════════════════════════ */
  var S = {
    userType: 'new-driver',      // new-driver | returning-driver
    starterPoints: 10,
    vehicleLinked: false,
    step: 'signup-reward',
    confettiPlayed: false        // one burst, ever, per arrival on the screen
  };

  var timers = [];
  function after(ms, fn) { var t = setTimeout(fn, ms); timers.push(t); return t; }
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }
  function announce(msg) {
    el.announcer.textContent = '';
    setTimeout(function () { el.announcer.textContent = msg; }, 60);
  }
  function prefersReduced() {
    var m = root.getAttribute('data-motion');
    if (m === 'reduced') { return true; }
    if (m === 'off') { return false; }
    return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }
  function actionMarkup(a) {
    var cls = 'a-btn a-btn--' + (a.kind === 'primary' ? 'primary' : 'outline');
    return '<button type="button" class="' + cls + '" data-act="' + a.act + '">' + a.label + '</button>';
  }

  /* ════════════════════════════════════════════════════════════════════
     THE BURST
     Restrained, about a second, out of the graphic, and never in the way:
     the canvas takes no pointer events, so Continue is tappable throughout.
     ════════════════════════════════════════════════════════════════════ */
  function playConfetti() {
    if (S.confettiPlayed) { return; }
    S.confettiPlayed = true;
    el.rewardMedal.removeAttribute('data-motion');
    if (prefersReduced()) {
      /* A still glow says "something happened" without moving anything. */
      el.rewardMedal.setAttribute('data-motion', 'still');
      return;
    }
    var canvas = el.rewardConfetti;
    var box = el.rewardMedal.getBoundingClientRect();
    if (!box.width) { return; }
    /* Three times the graphic, but never wider than the screen it is on: a
       fixed multiple put half the burst outside a 320dp frame, so the smallest
       phone got the least celebration. */
    var room = el.frame.clientWidth - 8;
    var span = Math.min(Math.round(box.width * 3), room);
    var w = canvas.width  = span;
    var h = canvas.height = span;
    canvas.style.width  = w + 'px';
    canvas.style.height = h + 'px';
    canvas.style.left = Math.round((box.width  - w) / 2) + 'px';
    canvas.style.top  = Math.round((box.height - h) / 2) + 'px';
    var ctx = canvas.getContext('2d');
    if (!ctx) { return; }

    var cs = getComputedStyle(root);
    var palette = ['--color-primary', '--color-secondary', '--color-warning',
                   '--color-success', '--color-text-on-dark']
      .map(function (n) { return cs.getPropertyValue(n).trim(); });

    var bits = [];
    for (var i = 0; i < 26; i++) {
      var a = (Math.PI * 2 * i) / 26 + (i % 3) * 0.12;
      var speed = 2.6 + (i % 5) * 0.55;
      bits.push({ x: w / 2, y: h / 2, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed - 1.2,
                  size: 3 + (i % 3), spin: (i % 7) * 0.14, colour: palette[i % palette.length] });
    }
    var start = null, DURATION = 1200;
    function frameStep(t) {
      if (start === null) { start = t; }
      var elapsed = t - start;
      ctx.clearRect(0, 0, w, h);
      if (elapsed > DURATION) { canvas.width = 0; return; }
      var fade = 1 - elapsed / DURATION;
      bits.forEach(function (b) {
        b.x += b.vx; b.y += b.vy; b.vy += 0.12; b.spin += 0.08;
        ctx.save();
        ctx.globalAlpha = Math.max(0, fade);
        ctx.translate(b.x, b.y);
        ctx.rotate(b.spin);
        ctx.fillStyle = b.colour;
        ctx.fillRect(-b.size / 2, -b.size / 2, b.size, b.size * 1.6);
        ctx.restore();
      });
      requestAnimationFrame(frameStep);
    }
    requestAnimationFrame(frameStep);
  }

  /* The one rule that decides where a driver lands. A returning driver has
     been welcomed before, so the celebration is skipped. */
  function route() {
    if (S.userType === 'new-driver') { showReward(); return; }

  /* ── The section panel ────────────────────────────────────────────────
     A long menu behaves better as two levels than as one column: the sidebar
     names the sections, and the panel holds the states of whichever one you
     opened. The behaviours are the ones people already expect from a menu
     like this, and each is here for a reason:

       Escape closes it            a keyboard user must never be trapped
       clicking outside closes it  the commonest way people dismiss a layer
       the trigger toggles it      pressing the same thing again undoes it
       choosing a state does NOT   stepping through a section is the job, and
                                   closing each time would cost two clicks
       focus moves in, and back    so the keyboard does not lose its place
       aria-expanded on the trigger so assistive tech is told what happened */
  var flyout = {
    el: null, list: null, title: null, openFor: null, returnTo: null
  };

  function buildFlyout() {
    var host = document.createElement('div');
    host.className = 'd-flyout';
    host.id = 'navFlyout';
    host.setAttribute('role', 'dialog');
    host.setAttribute('aria-label', 'States in this section');
    host.hidden = true;
    host.innerHTML =
      '<div class="d-flyout__head">' +
        '<p class="d-flyout__title" id="flyoutTitle"></p>' +
        '<button type="button" class="d-flyout__close" id="flyoutClose" aria-label="Close this section">' +
          '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-secondary)" ' +
          'stroke-width="2.2" stroke-linecap="round" aria-hidden="true">' +
          '<path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>' +
        '</button>' +
      '</div>' +
      '<div class="d-flyout__list" id="flyoutList"></div>' +
      '<p class="d-flyout__hint">Escape closes. Picking a state leaves this open.</p>';
    document.body.appendChild(host);
    flyout.el = host;
    flyout.list = host.querySelector('#flyoutList');
    flyout.title = host.querySelector('#flyoutTitle');
    host.querySelector('#flyoutClose').addEventListener('click', function () { closeFlyout(true); });

    /* Outside means outside both the panel and the button that opened it,
       or the trigger would close and immediately reopen. */
    document.addEventListener('pointerdown', function (e) {
      if (flyout.el.hidden) { return; }
      if (flyout.el.contains(e.target)) { return; }
      if (e.target.closest && e.target.closest('.d-stateNav__group')) { return; }
      closeFlyout(false);
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !flyout.el.hidden) { e.preventDefault(); closeFlyout(true); }
    });
    window.addEventListener('resize', function () {
      if (!flyout.el.hidden) { placeFlyout(); }
    });
  }

  /* Beside the section that opened it, nudged so it never runs off the
     bottom of the window. */
  function placeFlyout() {
    var trigger = document.querySelector('.d-stateNav__group[aria-expanded="true"]');
    if (!trigger) { return; }
    var t = trigger.getBoundingClientRect();
    var box = flyout.el.getBoundingClientRect();
    var top = Math.max(8, Math.min(t.top, window.innerHeight - box.height - 8));
    flyout.el.style.top = top + 'px';

    /* Beside the section, wherever that does not cover the phone. A panel over
       the screen you have just chosen is worse than no panel, because looking
       at the screen is the entire job.

       Three places, in order of preference: the gap between the sidebar and
       the phone, the space to the left of the sidebar, and the space past the
       phone. Left alignment removed the second of those, which is why there
       has to be a third. */
    var device = document.getElementById('deviceFrame');
    var nav = document.getElementById('stateNav').getBoundingClientRect();
    var dev = device ? device.getBoundingClientRect() : null;
    var right = t.right + 12;
    var fits = function (x) {
      if (x < 8 || x + box.width > window.innerWidth - 8) { return false; }
      return !dev || x + box.width <= dev.left + 1 || x >= dev.right - 1;
    };
    var choice = [right, nav.left - box.width - 12, dev ? dev.right + 12 : right].filter(fits)[0];
    flyout.el.style.left = Math.round(choice === undefined ? right : choice) + 'px';
  }

  function openFlyout(group, label, ids, viaKeyboard) {
    var trigger = document.querySelector('.d-stateNav__group[data-group="' + group + '"]');
    document.querySelectorAll('.d-stateNav__group').forEach(function (b) {
      b.setAttribute('aria-expanded', b === trigger ? 'true' : 'false');
    });
    flyout.openFor = group;
    flyout.returnTo = trigger;
    flyout.title.textContent = label;
    flyout.list.innerHTML = '';
    ids.forEach(function (id) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'd-stateNav__item';
      b.textContent = STATES[id].label;
      b.dataset.stateId = id;
      b.addEventListener('click', function () { go(id); });
      flyout.list.appendChild(b);
    });
    flyout.el.hidden = false;
    placeFlyout();
    setNav(currentState);
    /* Move focus in only when the keyboard opened it. A mouse user is already
       looking at the panel and about to click; giving them a focus ring on the
       first item is noise, and taking focus off what they were doing is worse. */
    if (viaKeyboard) {
      var first = flyout.list.querySelector('.d-stateNav__item');
      if (first) { first.focus({ preventScroll: true }); }
    }
  }

  function closeFlyout(restoreFocus) {
    if (flyout.el.hidden) { return; }
    flyout.el.hidden = true;
    document.querySelectorAll('.d-stateNav__group').forEach(function (b) {
      b.setAttribute('aria-expanded', 'false');
    });
    if (restoreFocus && flyout.returnTo) { flyout.returnTo.focus({ preventScroll: true }); }
    flyout.openFor = null;
  }

  /* A click made by pressing Enter or Space reports detail 0, which is how the
     browser tells us the pointer was not involved. */
  function toggleFlyout(group, label, ids, ev) {
    var viaKeyboard = !!ev && ev.detail === 0;
    if (flyout.openFor === group) { closeFlyout(viaKeyboard); return; }
    openFlyout(group, label, ids, viaKeyboard);
  }


  var currentState = null;
  function go(id) {
    var def = STATES[id];
    if (!def) { return; }
    currentState = id;
    def.run();
    setNav(id);
    if (location.hash.slice(1) !== id) { history.replaceState(null, '', '#' + id); }
    el.caption.textContent = id + ' · ' + def.label;
  }
  function setNav(id) {
    document.querySelectorAll('.d-stateNav__item').forEach(function (b) {
      if (b.dataset.stateId === id) { b.setAttribute('data-state', 'active'); b.setAttribute('aria-current', 'true'); }
      else { b.removeAttribute('data-state'); b.removeAttribute('aria-current'); }
    });
  }


  /* ── Every flow, in one menu ──────────────────────────────────────────
     Both prototypes list both flows, so any screen in the product is two
     clicks away from any other. A section belonging to this file opens its
     panel; a section belonging to the other one opens the same panel and its
     states navigate, because a hash on load lands exactly where you asked.

     The other flow's sections are declared here rather than read from it,
     because these are two files and one cannot see inside the other without a
     build step. It is a short list and it is the price of no build. If it
     drifts, the link still works and only the count is stale, which is the
     mildest way for a thing like this to be wrong. */
  var FLOWS = [

  var AWAY_STATES = {

      navNumber:  [['number/empty','Empty'],['number/partial','Part typed'],['number/valid','Valid'],
                   ['number/sending','Sending'],['number/err-format','Too few digits'],

  function openAwayFlyout(flow, key, label, ev) {
    var group = 'away:' + key;

  function sectionButton(label, count) {

  function buildNav() {
    buildFlyout();
    var host = document.getElementById('navSections');
    host.innerHTML = '';
    FLOWS.forEach(function (flow) {
      var head = document.createElement('p');
      head.className = 'd-stateNav__flow';
      head.textContent = flow.label;
      host.appendChild(head);

      flow.sections.forEach(function (sec) {
        var key = sec[0], label = sec[1];

        var ids = mine ? Object.keys(STATES).filter(function (k) { return STATES[k].group === key; }) : null;
        var b = sectionButton(label, mine ? ids.length : sec[2]);
        b.dataset.group = (mine ? '' : 'away:') + key;

  var MODES = [

    { key: 'width', label: 'Narrow, 320px',
      on: function () { return frame.getAttribute('data-width') === '320'; },
      toggle: function () {

        else { frame.setAttribute('data-width', '320'); }
      } },
    { key: 'spec', label: 'Design specs',
      on: function () { return root.getAttribute('data-spec') === 'on'; },
      toggle: function () {
        if (root.getAttribute('data-spec') === 'on') { root.removeAttribute('data-spec'); }
        else { root.setAttribute('data-spec', 'on'); }
      } },
    { key: 'grid', label: '4px grid',
      on: function () { return root.getAttribute('data-grid') === 'on'; },
      toggle: function () {
        if (root.getAttribute('data-grid') === 'on') { root.removeAttribute('data-grid'); }
        else { root.setAttribute('data-grid', 'on'); }
      } }
  ];
  function syncModes() {
    MODES.forEach(function (m) {
      var b = document.querySelector('[data-mode="' + m.key + '"]');
      if (!b) { return; }
      var on = m.on();
      if (on) { b.setAttribute('data-state', 'on'); } else { b.removeAttribute('data-state'); }
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }
  function buildModes() {
    document.getElementById('navModes').innerHTML = MODES.map(function (m) {
      return '<button type="button" class="d-stateNav__toggle" data-mode="' + m.key + '"' +
             ' aria-pressed="false"><span>' + m.label + '</span>' +
             '<span class="d-stateNav__switch"></span></button>';
    }).join('');
    document.querySelectorAll('[data-mode]').forEach(function (b) {
      b.addEventListener('click', function () {
        MODES.filter(function (m) { return m.key === b.getAttribute('data-mode'); })[0].toggle();
        syncModes();
      });
    });
    syncModes();
  }

  function buildSwitcher() {
    var views = [{ tab: 'tabStates', view: 'viewStates' }, { tab: 'tabNotes', view: 'viewNotes' }];
    function show(which) {
      views.forEach(function (v) {
        var on = v.tab === which;
        var tab = document.getElementById(v.tab);
        tab.setAttribute('aria-selected', on ? 'true' : 'false');
        if (on) { tab.setAttribute('data-state', 'active'); } else { tab.removeAttribute('data-state'); }
        document.getElementById(v.view).hidden = !on;
      });
      document.getElementById('stateNav').scrollTop = 0;
    }
    views.forEach(function (v) {
      document.getElementById(v.tab).addEventListener('click', function () { show(v.tab); });
    });
  }

  /* The panel is deliberately small here: the full specification lives in the
     sign-up prototype, and two copies of it would be two things to keep true. */
  function buildPanel() {
    var panel = document.getElementById('specPanel');
    var cs = getComputedStyle(root);
    var rows = [
      ['Where this sits', 'The last step of engenxt-signup.html hands over to this file. Sign-up is a separate flow with its own states and its own specification panel.'],
      ['Shared tokens', 'The token block and the shared atoms in this file are a verbatim copy of the ones in the sign-up prototype, so the two cannot disagree about a colour or a spacing step. When a third flow appears they belong in one stylesheet both files link.'],
      ['Reward, then task', 'Two screens, never one. A celebration that also asks for something is neither a celebration nor a clear instruction. The driver acknowledges the reward and the task comes after it.'],
      ['The burst', '26 pieces, 1.2 seconds, out of the graphic, on a canvas that takes no pointer events so Continue is tappable throughout. It runs once per arrival and never on a re-render. Under reduced motion it does not run at all and the graphic takes a still glow instead.'],
      ['Returning drivers', 'skip the reward. It is a one-time welcome, so showing it twice would make it worth nothing. A returning driver with no vehicle lands on the task; one with a vehicle skips both.'],
      ['Nothing is real', 'No point is awarded, nothing is remembered between loads, nothing is sent anywhere. The scan is a button that pretends.'],
      ['Spacing', 'Same scale as the sign-up flow: 8 is parts of one thing, 16 is one group to the next, 24 is a decision, 32 closes a centred group.'],
      ['Targets', 'Every control clears ' + cs.getPropertyValue('--size-target').trim() + '.']
    ];
    panel.innerHTML =
      '<div class="d-panel__head"><p class="d-panel__title">Design notes</p>' +
      '<p class="d-panel__lede">The welcome reward and the vehicle-linking task. ' +
      'The full token and component specification is in the sign-up prototype.</p></div>' +
      '<div class="d-section">' + rows.map(function (r) {
        return '<div style="margin-bottom:var(--sp-3);">' +
          '<p style="font-size:var(--text-micro);font-weight:800;margin-bottom:2px;">' + r[0] + '</p>' +
          '<p style="font-size:var(--text-micro);line-height:1.55;color:var(--color-text-secondary);">' + r[1] + '</p>' +
        '</div>';
      }).join('') + '</div>';
  }

  buildNav(); buildModes(); buildSwitcher(); buildPanel();
  var initial = location.hash.slice(1);
  go(STATES[initial] ? initial : 'signup-reward');

  window.Demo = { go: go, states: function () { return STATES; }, S: function () { return S; } };
})();

</script>
</body>
</html>
