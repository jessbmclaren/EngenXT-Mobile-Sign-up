<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -12 440 144" role="img" aria-label="tfn">
  <style>@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,900&amp;display=swap');</style>
  <rect x="-20" y="-12" width="440" height="144" fill="#ffffff"/>
  <defs>
    <clipPath id="oclip"><circle cx="50" cy="50" r="48"/></clipPath>
    <filter id="oblur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="oGrain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="2.4" numOctaves="1" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
    <radialGradient id="oBase" cx=".5" cy=".5" r=".6"><stop offset="0" stop-color="#eef6ff"/><stop offset="1" stop-color="#c3dcf5"/></radialGradient>
    <radialGradient id="oHi" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".55" stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <radialGradient id="oShade" cx=".5" cy=".42" r=".62"><stop offset=".6" stop-color="#0a2540" stop-opacity="0"/><stop offset="1" stop-color="#0a2540" stop-opacity=".45"/></radialGradient>
    <linearGradient id="oRim" x1=".2" y1="0" x2=".8" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".55"/></linearGradient>
  </defs>
  <g transform="translate(0 4) scale(1.12)"><g clip-path="url(#oclip)">
      <circle cx="50" cy="50" r="48" fill="#2f78bd"/>
      <g filter="url(#oblur)">
        <ellipse cx="52" cy="10" rx="46" ry="22" fill="#10346f"/>
        <ellipse cx="50" cy="98" rx="46" ry="20" fill="#1b4a92"/>
        <ellipse cx="66" cy="54" rx="34" ry="28" fill="#9fd6fa"/>
        <ellipse cx="30" cy="40" rx="22" ry="18" fill="#4a9be0"/>
        <ellipse cx="76" cy="74" rx="15" ry="10" fill="#dcf2ff"/>
        <ellipse cx="16" cy="62" rx="14" ry="16" fill="#2a6fb8"/>
      </g>
      <circle cx="50" cy="50" r="48" fill="url(#oShade)" opacity=".5"/>
      <rect x="2" y="2" width="96" height="96" filter="url(#oGrain)" opacity=".62" style="mix-blend-mode:overlay"/>
    </g></g>
  <text x="146" y="108" fill="#0a0a0a" font-family="Fraunces, Georgia, serif" font-weight="900" font-size="130" letter-spacing="1.3" style="font-variation-settings:'opsz' 144,'SOFT' 0,'WONK' 0;font-optical-sizing:none">TFN</text>
</svg>
